name: CI

# Run on every push and pull request targeting main or dev.
# Stacked PRs that target intermediate feature branches get coverage when the
# branch under review is eventually retargeted to dev/main for merge.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# No tool versions appear in this file. The toolchain (Go, Node, pnpm,
# golangci-lint, kind, kubectl, helm, buf, pre-commit) comes from mise.toml. uv
# and Python are managed outside mise: the uv version comes from `[tool.uv]
# required-version` in analyzer/pyproject.toml, and uv installs the interpreter
# named in analyzer/.python-version. Python packages come from
# analyzer/uv.lock; console packages from console/pnpm-lock.yaml.
# See docs/TOOLCHAIN.md.

jobs:
  lint:
    name: Lint (Go, Python, TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: analyzer/pyproject.toml
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('sensor/go.sum', 'operator/go.sum', 'api/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install analyzer dependencies
        run: uv sync --locked
        working-directory: analyzer

      - name: Install console dependencies
        run: pnpm install --frozen-lockfile
        working-directory: console

      - name: make lint
        run: make lint

  test:
    name: Test (Go, Python, TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: analyzer/pyproject.toml
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('sensor/go.sum', 'operator/go.sum', 'api/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install analyzer dependencies
        run: uv sync --locked
        working-directory: analyzer

      - name: Install console dependencies
        run: pnpm install --frozen-lockfile
        working-directory: console

      - name: make test
        run: make test

  validate:
    name: Validate tooling config
    runs-on: ubuntu-latest
    # Run after lint and test to catch config drift separately.
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: analyzer/pyproject.toml
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('sensor/go.sum', 'operator/go.sum', 'api/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install analyzer dependencies
        run: uv sync --locked
        working-directory: analyzer

      - name: Install console dependencies
        run: pnpm install --frozen-lockfile
        working-directory: console

      - name: Validate golangci-lint config
        run: bash scripts/golangci_lint_test.sh

      - name: Validate Python/TS lint config
        run: bash scripts/python_ts_lint_test.sh

      - name: Validate make test wiring
        run: bash scripts/make_test_smoke_test.sh

      - name: Validate Makefile targets
        run: bash scripts/makefile_smoke_test.sh

      - name: Validate pre-commit hooks
        run: bash scripts/pre_commit_test.sh
