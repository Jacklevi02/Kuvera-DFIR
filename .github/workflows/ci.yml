name: CI

# Run on every push and pull request targeting main or dev.
# Stacked PRs that target intermediate feature branches get coverage when the
# branch under review is eventually retargeted to dev/main for merge.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# No tool versions appear in this file. The toolchain (Go, Node, pnpm,
# golangci-lint, shellcheck, kind, kubectl, helm, buf, pre-commit) comes from
# mise.toml. uv and Python are managed outside mise: the uv version comes from
# `[tool.uv] required-version` in analyzer/pyproject.toml, and uv installs the
# interpreter named in analyzer/.python-version. Python packages come from
# analyzer/uv.lock; console packages from console/pnpm-lock.yaml.
# uv is set up before mise because mise installs pre-commit through uv.
# See docs/TOOLCHAIN.md.

jobs:
  lint:
    name: Lint (Go, Python, TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: analyzer/pyproject.toml
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock

      - name: Set up toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('sensor/go.sum', 'operator/go.sum', 'api/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install analyzer dependencies
        run: uv sync --locked
        working-directory: analyzer

      - name: Install console dependencies
        run: pnpm install --frozen-lockfile
        working-directory: console

      - name: make lint
        run: make lint

  test:
    name: Test (Go, Python, TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: analyzer/pyproject.toml
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock

      - name: Set up toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('sensor/go.sum', 'operator/go.sum', 'api/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install analyzer dependencies
        run: uv sync --locked
        working-directory: analyzer

      - name: Install console dependencies
        run: pnpm install --frozen-lockfile
        working-directory: console

      - name: make test
        run: make test

  validate:
    name: Validate tooling config
    runs-on: ubuntu-latest
    # Run after lint and test to catch config drift separately.
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: analyzer/pyproject.toml
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock

      - name: Set up toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Cache Go modules and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('sensor/go.sum', 'operator/go.sum', 'api/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install analyzer dependencies
        run: uv sync --locked
        working-directory: analyzer

      - name: Install console dependencies
        run: pnpm install --frozen-lockfile
        working-directory: console

      # mise-action restores pre-commit from its cache, but not the uv-managed
      # Python it was built on.
      - name: Rebuild pre-commit
        run: mise install --force pypi:pre-commit

      - name: make test-tooling
        run: make test-tooling

  cluster:
    name: Live cluster (kind + eBPF)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: analyzer/pyproject.toml
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock

      - name: Set up toolchain
        uses: jdx/mise-action@v5
        with:
          cache: true

      - name: make dev-cluster
        run: make dev-cluster

      - name: Verify eBPF prerequisites
        run: scripts/dev-cluster-verify.sh

      # The second run is the negative control: without privilege the kernel must
      # refuse the load, so a probe that always passes fails this step.
      - name: Load an eBPF program in a kind node
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/ebpf-probe" scripts/ebpf-probe.go
          docker cp "$RUNNER_TEMP/ebpf-probe" kuvera-dev-control-plane:/ebpf-probe
          docker exec kuvera-dev-control-plane /ebpf-probe
          docker exec --user 65534 kuvera-dev-control-plane /ebpf-probe 2>&1 | grep -F 'operation not permitted'
