[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kuvera-analyzer"
version = "0.1.0"
description = "Kuvera evidence analysis workers"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "mypy>=1.19",
    "pytest>=8",
    "structlog>=24",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["kuvera_analyzer", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
