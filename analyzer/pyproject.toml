[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kuvera-analyzer"
version = "0.1.0"
description = "Kuvera evidence analysis workers"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# Installed by default with `uv sync`, so `uv run` never drops them.
dev = [
    "ruff>=0.17.3",
    "mypy>=2.4",
    "pytest>=9.2",
    "structlog>=26.1",
]

[tool.uv]
# uv is installed standalone, not by mise. This is its only version pin;
# astral-sh/setup-uv reads it in CI.
required-version = ">=0.13,<0.14"
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["kuvera_analyzer", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
